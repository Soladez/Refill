name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Fehler im Code als Annotationen anzeigen
        run: echo "::add-matcher::.github/javac.json"

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: refill-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Release erstellen (nur bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/refill-*.jar
            !build/libs/*-sources.jar
